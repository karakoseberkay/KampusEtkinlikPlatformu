name: CampusBody API Fuzz Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis:
    name: Schemathesis GET API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake up backend
        run: |
          curl \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            "https://campusbody-api.onrender.com/api/Events/popular?limit=1" > /dev/null

      - name: Get Student JWT
        id: student_login
        env:
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
        run: |
          body=$(jq -n \
            --arg email "$TEST_STUDENT_EMAIL" \
            --arg password "$TEST_STUDENT_PASSWORD" \
            '{email: $email, password: $password}')

          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            "https://campusbody-api.onrender.com/api/Auth/login" \
            -H "Content-Type: application/json" \
            -d "$body")

          token=$(echo "$response" | jq -r '.accessToken')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Student JWT could not be retrieved"
            exit 1
          fi

          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Schemathesis Student GET Fuzz Tests
        uses: schemathesis/action@v3
        with:
          schema: 'https://campusbody-api.onrender.com/openapi/v1.json'
          base-url: 'https://campusbody-api.onrender.com'
          authorization: 'Bearer ${{ steps.student_login.outputs.token }}'
          checks: 'not_a_server_error'
          max-examples: 25
          args: '--include-method GET --phases=coverage,fuzzing --request-timeout 15 --request-retries 2'
          coverage-artifact-name: 'schemathesis-student-coverage'
          coverage-step-summary: 'true'

      - name: Get ClubManager JWT
        id: manager_login
        env:
          TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
          TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}
        run: |
          body=$(jq -n \
            --arg email "$TEST_MANAGER_EMAIL" \
            --arg password "$TEST_MANAGER_PASSWORD" \
            '{email: $email, password: $password}')

          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            "https://campusbody-api.onrender.com/api/Auth/login" \
            -H "Content-Type: application/json" \
            -d "$body")

          token=$(echo "$response" | jq -r '.accessToken')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "ClubManager JWT could not be retrieved"
            exit 1
          fi

          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Schemathesis ClubManager GET Fuzz Tests
        uses: schemathesis/action@v3
        with:
          schema: 'https://campusbody-api.onrender.com/openapi/v1.json'
          base-url: 'https://campusbody-api.onrender.com'
          authorization: 'Bearer ${{ steps.manager_login.outputs.token }}'
          checks: 'not_a_server_error'
          max-examples: 25
          args: '--include-method GET --phases=coverage,fuzzing --request-timeout 15 --request-retries 2'
          coverage-artifact-name: 'schemathesis-manager-coverage'
          coverage-step-summary: 'true'