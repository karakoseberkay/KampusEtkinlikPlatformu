name: CampusBody Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  playwright-tests:
    name: Production E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/kampus-etkinlik-ui

    env:
      BASE_URL: https://campusbody-azure.vercel.app
      API_BASE_URL: https://campusbody-api.onrender.com/api

      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
      TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/kampus-etkinlik-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wake up production backend
        run: |
          curl \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            "https://campusbody-api.onrender.com/api/Events/popular?limit=1" > /dev/null

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/kampus-etkinlik-ui/playwright-report/
            frontend/kampus-etkinlik-ui/test-results/
          if-no-files-found: ignore
          retention-days: 14