name: CampusBody Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake up frontend
        run: |
          curl \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 90 \
            --fail \
            --silent \
            --show-error \
            "https://campusbody-azure.vercel.app" > /dev/null

      - name: Wake up backend
        run: |
          curl \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            "https://campusbody-api.onrender.com/api/Events/popular?limit=1" > /dev/null

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://campusbody-azure.vercel.app'
          artifact_name: campusbody-zap-report
          cmd_options: '-a'