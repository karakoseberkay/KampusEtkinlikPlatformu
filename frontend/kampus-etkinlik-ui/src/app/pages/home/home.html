<main class="home-page">
  <section class="home-card">
    @if (
      authService.currentUser();
      as user
    ) {
      <span class="status-badge">
        Giriş başarılı
      </span>

      <h1>
        Hoş geldin,
        {{ user.fullName }}
      </h1>

      <p class="email">
        {{ user.email }}
      </p>

      <div class="role-list">
        @for (
          role of user.roles;
          track role
        ) {
          <span class="role-badge">
            {{ role }}
          </span>
        }
      </div>

      <div class="button-row">
        <button
          class="primary-button"
          type="button"
          [disabled]="testingToken()"
          (click)="testProtectedEndpoint()"
        >
          @if (testingToken()) {
            JWT test ediliyor...
          } @else {
            Korumalı Endpoint'i Test Et
          }
        </button>

        <button
          class="secondary-button"
          type="button"
          (click)="logout()"
        >
          Çıkış Yap
        </button>
      </div>

      @if (successMessage()) {
        <div class="message success">
          {{ successMessage() }}
        </div>
      }

      @if (errorMessage()) {
        <div class="message error">
          {{ errorMessage() }}
        </div>
      }
    }
  </section>
</main>
